<title>Leashed Agent Film</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;600&family=JetBrains+Mono:wght@400;500;700&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
/* Layout: letterboxed 16:9 film stage, transport bar beneath, chapters list. Paper-ledger look, single theme by choice. */
:root{
  --bg:#ece8dc; --sheet:#f5f2e9; --ink:#1b2c3e; --ink-55:rgba(27,44,62,.6); --rule:rgba(27,44,62,.16);
  --blue:#1f4e79; --red:#a93837; --green:#2d7d4a; --gold:#a07c2c;
  --f-serif:'Fraunces','IBM Plex Sans Thai',Georgia,serif;
  --f-sans:'IBM Plex Sans','IBM Plex Sans Thai',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  color-scheme:light;
}
body{background:var(--bg);color:var(--ink);font-family:var(--f-sans);font-size:15px;line-height:1.45}
.wrap{max-width:1280px;margin-inline:auto;padding-inline:16px;padding-block:20px 40px;display:grid;gap:16px}
.top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 24px}
.top h1{margin:0;font:700 24px var(--f-serif);letter-spacing:-.01em}
.top h1 span{color:var(--blue)}
.meta{font:500 12px var(--f-mono);letter-spacing:.08em;color:var(--ink-55);text-transform:uppercase}
.stage{position:relative;aspect-ratio:16/9;width:100%;max-width:100%;background:#0e1a27;overflow:hidden;container-type:inline-size;border:1px solid var(--rule);box-shadow:0 18px 40px -22px rgba(27,44,62,.5)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.big{position:absolute;inset:0;margin:auto;width:max-content;height:max-content;display:flex;align-items:center;gap:14px;padding:14px 26px 14px 18px;border:2px solid var(--ink);background:var(--sheet);color:var(--ink);font:700 clamp(14px,2cqw,22px)/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;box-shadow:6px 6px 0 var(--ink)}
.big svg{width:clamp(20px,2.8cqw,32px);height:auto;fill:var(--red)}
.big:hover{transform:translate(-1px,-1px);box-shadow:8px 8px 0 var(--ink)}
.chip{position:absolute;left:12px;top:12px;font:500 11px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;padding:8px 10px;background:var(--sheet);border:1.5px solid var(--red);color:var(--red);transform:rotate(-1.2deg)}
.bar{display:grid;grid-template-columns:auto auto 1fr;align-items:center;gap:14px}
.time{font:500 14px var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink-55);white-space:nowrap}
.time b{color:var(--ink);font-weight:500}
input[type=range]{width:100%;min-width:0;accent-color:var(--blue);height:28px;margin:0;cursor:pointer}
.btns{display:flex;flex-wrap:wrap;gap:8px}
button.b{font:600 12px var(--f-mono);letter-spacing:.04em;text-transform:uppercase;color:var(--ink);background:var(--sheet);border:1.5px solid var(--ink);padding:9px 14px;cursor:pointer}
button.b:hover{background:#fff}
button.b[aria-pressed=true]{background:var(--ink);color:var(--sheet)}
button.b.main{background:var(--red);border-color:var(--red);color:#fff;min-width:96px}
button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.hint{font-size:12.5px;color:var(--ink-55);margin:0}
.hint kbd{font:500 11px var(--f-mono);border:1px solid var(--rule);background:var(--sheet);padding:1px 5px;color:var(--ink)}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:4px 20px;border-top:2px solid var(--ink);padding-top:12px}
.act{display:contents}
.ch{width:100%;display:grid;grid-template-columns:52px 1fr;text-align:left;gap:8px;padding:9px 10px;background:transparent;border:1px solid transparent;color:var(--ink);font:500 14px var(--f-sans);cursor:pointer}
.ch:hover{background:var(--sheet)}
.ch[aria-current=true]{background:var(--sheet);border-color:var(--ink);color:var(--blue);font-weight:600}
.ch i{font:500 12px var(--f-mono);color:var(--ink-55);font-style:normal;font-variant-numeric:tabular-nums;padding-top:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
body.clean{overflow:hidden;background:#000}
body.clean .wrap{max-width:none;padding:0;display:block}
body.clean .wrap>:not(.stage){display:none}
body.clean .stage{position:fixed;inset:0;margin:auto;width:min(100vw,177.78vh);border:0;box-shadow:none}
body.clean .chip{display:none}
@media (max-width:560px){.bar{grid-template-columns:auto 1fr}.bar .time{grid-column:1/-1;order:3}}
</style>

<div class="wrap">
  <header class="top">
    <h1>Leashed <span>Agent</span> film</h1>
    <div class="meta" id="meta">TOKEN2049 Origins Hackathon · Cardano Agentic Commerce · Chainlink CRE · NOWNodes</div>
  </header>

  <div class="stage" id="stage">
    <canvas id="cv" aria-label="Leashed Agent pitch film"></canvas>
    <div class="chip" id="chip" hidden>Recreated UI · swap for live capture</div>
    <button class="big" id="big" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg><span id="bigl">Play film</span></button>
  </div>
  <p class="sr" id="live" aria-live="polite"></p>

  <div class="bar">
    <button class="b main" id="play" type="button">Play</button>
    <div class="time"><b id="tnow">0:00</b> / <span id="tall">2:00</span></div>
    <input type="range" id="scrub" min="0" max="120" step="0.05" value="0" aria-label="Timeline">
  </div>

  <div class="btns">
    <button class="b" id="restart" type="button">Restart</button>
    <button class="b" id="bcap" type="button" aria-pressed="true">Captions</button>
    <button class="b" id="bsnd" type="button" aria-pressed="true">Sound</button>
    <button class="b" id="bnar" type="button" aria-pressed="false">Narration (browser voice)</button>
    <button class="b" id="bclean" type="button">Clean mode</button>
    <button class="b" id="bfs" type="button">Fullscreen</button>
    <button class="b" id="brec" type="button" hidden>Record WebM</button>
  </div>
  <p class="hint"><kbd>Space</kbd> play/pause · <kbd>←</kbd><kbd>→</kbd> 5s · <kbd>[</kbd><kbd>]</kbd> scene · <kbd>H</kbd> clean mode (hides every control for screen capture, <kbd>Esc</kbd> to exit) · <kbd>F</kbd> fullscreen</p>

  <div class="acts" id="acts"></div>
</div>

<script>
(()=>{
'use strict';
const W=1920,H=1080,TAU=Math.PI*2;
const cv=document.getElementById('cv');cv.width=W;cv.height=H;
const ctx=cv.getContext('2d');
if(!ctx.roundRect){ctx.roundRect=function(x,y,w,h,r){r=Math.min(r,w/2,h/2);this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();};}

/* ---------- tokens (from the passbook design) ---------- */
const PAPER='236,232,220',SHEET='245,242,233',INK='27,44,62',BLUE='31,78,121',BLUEL='59,124,185',RED='169,56,55',GREEN='45,125,74',GOLD='160,124,44',NIGHT='14,26,39',NAVY='38,48,122';
const rgba=(c,a)=>`rgba(${c},${a})`,rgb=c=>`rgb(${c})`;
const F_S="'Fraunces','IBM Plex Sans Thai',serif";
const F_B="'IBM Plex Sans','IBM Plex Sans Thai',sans-serif";
const F_T="'IBM Plex Sans Thai','IBM Plex Sans',sans-serif";
const F_M="'JetBrains Mono',ui-monospace,monospace";
const F_H="'Caveat','Segoe Script',cursive";

/* ---------- math ---------- */
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,x)=>a+(b-a)*x;
const sm=(a,b,x)=>{x=clamp((x-a)/(b-a));return x*x*(3-2*x)};
const eo=x=>1-Math.pow(1-clamp(x),3);
const eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const R=s=>{const x=Math.sin(s*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const rr=(x,y,w,h,r)=>{ctx.beginPath();ctx.roundRect(x,y,w,h,r)};
const fmt0=n=>Math.round(n).toLocaleString('en-US');

/* ---------- text ---------- */
function txt(s,x,y,o={}){
  ctx.save();
  ctx.font=`${o.w||500} ${o.s||30}px ${o.f||F_B}`;
  ctx.textAlign=o.a||'left';ctx.textBaseline=o.b||'alphabetic';
  if(o.ls)ctx.letterSpacing=o.ls+'px';
  ctx.globalAlpha*=(o.al??1);
  ctx.fillStyle=o.c||rgb(INK);
  ctx.fillText(s,x,y);
  ctx.restore();
}
const lab=(s,x,y,o={})=>txt(s,x,y,{f:F_M,s:o.s||16,w:500,ls:2.5,c:o.c||rgba(INK,.58),a:o.a,al:o.al});
function pill(s,x,y,c=BLUE,al=1,o={}){
  ctx.save();ctx.globalAlpha*=al;
  const sz=o.s||20;ctx.font=`500 ${sz}px ${F_M}`;ctx.letterSpacing='2px';
  const w=ctx.measureText(s).width+36,h=sz+22;
  ctx.fillStyle=o.fill||rgba(c,.1);ctx.strokeStyle=rgba(c,.8);ctx.lineWidth=2;
  rr(x,y-h/2,w,h,3);ctx.fill();ctx.stroke();
  ctx.fillStyle=rgb(o.tc||c);ctx.textBaseline='middle';ctx.fillText(s,x+18,y+1);
  ctx.restore();return w;
}

/* ---------- paper ---------- */
const grain=(()=>{const c=document.createElement('canvas');c.width=960;c.height=540;const g=c.getContext('2d');for(let i=0;i<9000;i++){g.fillStyle=`rgba(${INK},${R(i)*.07})`;g.fillRect(R(i*3+1)*960,R(i*5+2)*540,1.6,1.6)}return c})();
function paper(){
  ctx.fillStyle=rgb(PAPER);ctx.fillRect(0,0,W,H);
  ctx.save();ctx.globalAlpha=.9;ctx.drawImage(grain,0,0,W,H);ctx.restore();
  ctx.lineWidth=1;
  for(let x=0;x<=W;x+=48){ctx.strokeStyle=rgba(BLUE,x%240?.045:.09);ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
  for(let y=0;y<=H;y+=48){ctx.strokeStyle=rgba(BLUE,y%240?.045:.09);ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
  const g=ctx.createRadialGradient(W/2,H/2,H*.45,W/2,H/2,H*1.05);g.addColorStop(0,rgba(INK,0));g.addColorStop(1,rgba(INK,.16));ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}
function sheet(x,y,w,h,fill=SHEET){
  ctx.save();ctx.shadowColor=rgba(INK,.22);ctx.shadowBlur=42;ctx.shadowOffsetY=16;
  ctx.fillStyle=rgb(fill);ctx.fillRect(x,y,w,h);ctx.restore();
  ctx.strokeStyle=rgba(INK,.14);ctx.lineWidth=1.5;ctx.strokeRect(x,y,w,h);
}
function stamp(s,sub,cx,cy,rot,c,p,size=34){
  if(p<=0)return;
  const k=eo(clamp(p*2.6)),sc=lerp(2.1,1,k);
  ctx.save();ctx.translate(cx,cy);ctx.rotate(rot);ctx.scale(sc,sc);ctx.globalAlpha*=clamp(p*5);ctx.globalCompositeOperation='multiply';
  ctx.font=`700 ${size}px ${F_M}`;ctx.letterSpacing='4px';const w1=ctx.measureText(s).width;
  ctx.font=`500 ${size*.4}px ${F_M}`;ctx.letterSpacing='2px';const w2=sub?ctx.measureText(sub).width:0;
  const w=Math.max(w1,w2)+60,h=size*(sub?2.2:1.7);
  ctx.strokeStyle=rgba(c,.92);ctx.lineWidth=5;rr(-w/2,-h/2,w,h,10);ctx.stroke();
  ctx.lineWidth=2;rr(-w/2+9,-h/2+9,w-18,h-18,6);ctx.stroke();
  ctx.fillStyle=rgba(c,.92);ctx.textAlign='center';
  ctx.font=`700 ${size}px ${F_M}`;ctx.letterSpacing='4px';ctx.fillText(s,2,sub?-size*.08:size*.34);
  if(sub){ctx.font=`500 ${size*.4}px ${F_M}`;ctx.letterSpacing='2px';ctx.fillText(sub,1,size*.62)}
  ctx.restore();
}
function check(x,y,s,c,lw=5){ctx.save();ctx.strokeStyle=c;ctx.lineWidth=lw;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(x-s*.5,y);ctx.lineTo(x-s*.12,y+s*.38);ctx.lineTo(x+s*.55,y-s*.4);ctx.stroke();ctx.restore()}
function cross(x,y,s,c,lw=5){ctx.save();ctx.strokeStyle=c;ctx.lineWidth=lw;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x-s/2,y-s/2);ctx.lineTo(x+s/2,y+s/2);ctx.moveTo(x+s/2,y-s/2);ctx.lineTo(x-s/2,y+s/2);ctx.stroke();ctx.restore()}
function qr(x,y,size,seed=1){
  const n=25,m=size/n;ctx.fillStyle=rgb(SHEET);ctx.fillRect(x-12,y-12,size+24,size+24);ctx.fillStyle=rgb(INK);
  for(let i=0;i<n;i++)for(let j=0;j<n;j++){const f=(i<8&&j<8)||(i>16&&j<8)||(i<8&&j>16);if(!f&&R(i*31+j*7+seed)>.5)ctx.fillRect(x+i*m,y+j*m,m+.5,m+.5)}
  const fin=(a,b)=>{ctx.fillStyle=rgb(INK);ctx.fillRect(x+a*m,y+b*m,7*m,7*m);ctx.fillStyle=rgb(SHEET);ctx.fillRect(x+(a+1)*m,y+(b+1)*m,5*m,5*m);ctx.fillStyle=rgb(INK);ctx.fillRect(x+(a+2)*m,y+(b+2)*m,3*m,3*m)};
  fin(0,0);fin(18,0);fin(0,18);
}

/* ---------- actors ---------- */
function agent(x,y,r,t,dead=false,glowA=1){
  ctx.save();ctx.translate(x,y);
  const c=dead?'122,130,138':BLUE;
  if(!dead){ctx.strokeStyle=rgba(BLUEL,.25*glowA);ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,r*(1.28+.06*Math.sin(t*2.4)),0,TAU);ctx.stroke()}
  ctx.strokeStyle=rgb(c);ctx.lineWidth=r*.07;ctx.beginPath();ctx.moveTo(0,-r*.9);ctx.lineTo(0,-r*1.32);ctx.stroke();
  ctx.fillStyle=rgb(dead?'160,166,172':RED);ctx.beginPath();ctx.arc(0,-r*1.4,r*.1,0,TAU);ctx.fill();
  ctx.fillStyle=rgb(c);ctx.beginPath();ctx.arc(0,0,r,0,TAU);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=r*.04;ctx.beginPath();ctx.arc(0,0,r*.86,Math.PI*1.05,Math.PI*1.75);ctx.stroke();
  ctx.fillStyle=rgb(SHEET);rr(-r*.6,-r*.3,r*1.2,r*.6,r*.2);ctx.fill();
  ctx.strokeStyle=rgb(INK);ctx.fillStyle=rgb(INK);ctx.lineWidth=r*.07;ctx.lineCap='round';
  const ey=0,ex=r*.26;
  if(dead){[-ex,ex].forEach(e=>{ctx.beginPath();ctx.moveTo(e-r*.09,ey-r*.09);ctx.lineTo(e+r*.09,ey+r*.09);ctx.moveTo(e+r*.09,ey-r*.09);ctx.lineTo(e-r*.09,ey+r*.09);ctx.stroke()})}
  else{const bl=Math.sin(t*1.3)>.96?.2:1;[-ex,ex].forEach(e=>{ctx.beginPath();ctx.ellipse(e,ey,r*.09,r*.1*bl,0,0,TAU);ctx.fill()})}
  ctx.restore();
}
function owner(x,y,s=1,label='OWNER'){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  ctx.fillStyle=rgb(INK);rr(-34,-34,68,68,6);ctx.fill();
  ctx.strokeStyle=rgb(PAPER);ctx.lineWidth=5;ctx.lineCap='round';
  ctx.beginPath();ctx.arc(-8,-4,11,0,TAU);ctx.stroke();ctx.beginPath();ctx.moveTo(3,-4);ctx.lineTo(22,-4);ctx.moveTo(15,-4);ctx.lineTo(15,6);ctx.moveTo(22,-4);ctx.lineTo(22,4);ctx.stroke();
  txt(label,0,62,{a:'center',f:F_M,s:15,w:500,ls:3,c:rgba(INK,.7)});
  ctx.restore();
}
function leashPts(ax,ay,bx,by,t,sag){
  const mx=(ax+bx)/2,my=Math.max(ay,by)+sag+Math.sin(t*1.4)*8;
  return u=>({x:(1-u)*(1-u)*ax+2*(1-u)*u*mx+u*u*bx,y:(1-u)*(1-u)*ay+2*(1-u)*u*my+u*u*by});
}
function leash(ax,ay,bx,by,p,t,o={}){
  const col=o.c||BLUE,f=leashPts(ax,ay,bx,by,t,o.sag??70);
  ctx.save();ctx.lineCap='round';ctx.lineWidth=o.w||7;ctx.strokeStyle=rgba(col,.9);
  if(o.snap>0){
    const k=eo(o.snap);
    ctx.beginPath();for(let i=0;i<=40;i++){const q=f(i/40*(.45-.12*k));i?ctx.lineTo(q.x,q.y+k*30*(i/40)):ctx.moveTo(q.x,q.y)}ctx.stroke();
    ctx.beginPath();for(let i=0;i<=40;i++){const q=f(.55+.12*k+i/40*(.45-.12*k));i?ctx.lineTo(q.x+k*18*(1-i/40),q.y-k*20*(1-i/40)):ctx.moveTo(q.x,q.y)}ctx.stroke();
    ctx.restore();return;
  }
  ctx.beginPath();const n=60;for(let i=0;i<=n*p;i++){const q=f(i/n);i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y)}ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=2;ctx.setLineDash([2,16]);ctx.beginPath();for(let i=0;i<=n*p;i++){const q=f(i/n);i?ctx.lineTo(q.x,q.y-2):ctx.moveTo(q.x,q.y-2)}ctx.stroke();
  ctx.restore();
}
function creditCard(x,y,rot,al=1){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.globalAlpha*=al;
  const g=ctx.createLinearGradient(-170,-105,170,105);g.addColorStop(0,'#33506b');g.addColorStop(1,'#16263a');
  ctx.fillStyle=g;ctx.strokeStyle='rgba(236,232,220,.4)';ctx.lineWidth=2;rr(-170,-105,340,210,20);ctx.fill();ctx.stroke();
  ctx.fillStyle='#d2b169';rr(-135,-52,58,44,8);ctx.fill();
  txt('•••• •••• •••• ••••',-135,40,{f:F_M,s:26,w:500,c:'rgba(236,232,220,.85)',ls:2});
  txt('YOUR CARD',-135,80,{f:F_M,s:15,w:500,c:'rgba(236,232,220,.6)',ls:4});
  ctx.restore();
}

/* ---------- scenes ---------- */
function s1(lt){
  ctx.fillStyle=rgb(NIGHT);ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(236,232,220,.05)';ctx.lineWidth=1;ctx.beginPath();for(let x=0;x<W;x+=48){ctx.moveTo(x,0);ctx.lineTo(x,H)}for(let y=0;y<H;y+=48){ctx.moveTo(0,y);ctx.lineTo(W,y)}ctx.stroke();
  const L1='Would you give an AI',L2='your credit card?';
  txt(L1.slice(0,Math.ceil(L1.length*clamp((lt-.4)/1.6))),140,250,{f:F_S,s:112,w:700,c:rgb(PAPER)});
  txt(L2.slice(0,Math.ceil(L2.length*clamp((lt-1.8)/1.4))),140,376,{f:F_S,s:112,w:700,c:rgb(PAPER)});
  const ag={x:1600,y:690},calm=sm(8.2,9.2,lt);
  const k=eo((lt-2.6)/1.4),cardA=1-sm(7.6,8.4,lt);
  if(cardA>0)creditCard(lerp(1000,1370,k),lerp(700,690,k),lerp(-.14,-.05,k),cardA);
  const spent=48210*sm(4,7.6,lt),sa=sm(4,4.6,lt)*(1-sm(7.6,8.4,lt));
  if(sa>0){
    lab('AGENT SPEND · NO LIMIT',140,610,{c:rgba(RED,.95),al:sa,s:18});
    const j=sa>.9&&lt<7.6?Math.sin(lt*60)*2:0;
    txt('฿ '+fmt0(spent),140+j,720,{f:F_M,s:96,w:700,c:rgb('214,96,92'),al:sa});
    lab('while you were asleep',140,770,{c:rgba(PAPER,.55),al:sa,s:18});
  }
  [['no enforced budget',4.6],['no receipts',5.4],['no independent audit',6.2]].forEach((r,i)=>{
    const a=sm(r[1],r[1]+.5,lt)*(1-sm(7.6,8.4,lt));if(a<=0)return;
    cross(152,452+i*46,16,rgba(RED,.95*a),4);txt(r[0],184,460+i*46,{f:F_M,s:24,w:500,c:rgba(PAPER,.8*a),ls:1.5});
  });
  const lp=eo((lt-8.2)/1.3);
  if(lp>0){leash(1120,860,ag.x-70,ag.y+70,lp,lt,{c:'111,162,208',sag:60,w:8});owner(1120,830,1.1,'OWNER')}
  agent(ag.x,ag.y,100,lt,false,calm);
  txt('Put it on a leash.',140,560,{f:F_S,s:88,w:600,c:'#e2be6a',al:sm(8.6,9.6,lt)});
}
function s2(lt){
  paper();
  const steps=[['Sign in','Passkey-only wallet'],['Fund the agent','PromptPay or the faucet'],['Deploy with a leash','agent deploy noodle-shop'],['See the agent','/agents']];
  const win=[[0,5],[5,12],[12,20],[20,26]],st=lt<5?0:lt<12?1:lt<20?2:3;
  lab('OWNER · THE ONLY HUMAN',110,130,{c:rgba(BLUE,.9)});
  steps.forEach((s,i)=>{
    const y=170+i*165,act=i===st,done=i<st;

function drawCaption(s,lt){

let AC=null,master=null,dest=null;
function audioInit(){
  if(AC)return;

    AC=new(window.AudioContext||window.webkitAudioContext)();

    dest=AC.createMediaStreamDestination();master.connect(dest);
    const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=480;lp.connect(master);
    [[65.4,'sine',.5],[98,'sine',.35],[130.8,'triangle',.1],[196,'sine',.07]].forEach(([f,ty,g])=>{const o=AC.createOscillator();o.type=ty;o.frequency.value=f;const gg=AC.createGain();gg.gain.value=g;o.connect(gg);gg.connect(lp);o.start()});
    const lfo=AC.createOscillator();lfo.frequency.value=.06;const lg=AC.createGain();lg.gain.value=200;lfo.connect(lg);lg.connect(lp.frequency);lfo.start();
  }catch(e){AC=null}
}

}
